- slug: image-approximation
  title: Adaptive Image Approximation
  category: Algorithms / Image processing
  summary: An adaptive image approximation that replaces regions with average colors, refining the regions with the most error until a target mean absolute error is reached. It creates a visual approximation, not a smaller encoded file.
  implementation: A priority queue selects high-error regions for recursive subdivision. NumPy calculates region colors and normalized mean absolute error; a Python CLI loads and saves images.
  contribution: Implemented the approximation algorithm, command-line workflow, test suite, and benchmark for runtime and measured image error.
  stack: [Python, NumPy, Pillow, unittest]
  repo_url: https://github.com/kyle2363/image_compressor
