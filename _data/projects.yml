- slug: breakout
  title: Breakout DQN
  category: Machine learning / Reinforcement learning
  summary: A Breakout-style game and a deep Q-learning agent that learns from pixels rather than a hand-written paddle controller.
  implementation: A convolutional network estimates action values from stacked frames. Experience replay and a target network support the training loop, with checkpoints for watching the agent play.
  contribution: Implemented the game environment, agent, and training pipeline in Python and PyTorch.
  stack: [Python, PyTorch, NumPy, Pygame]
  repo_url: ""
  demo_url: ""
  image: ""
  image_alt: ""
  figure_label: System note / Agent training loop
  flow: [Stacked game frames, CNN estimates action values, Agent chooses a paddle action, Reward & transition stored in replay]
  figure_note: Learn from sampled experience, then repeat.
  caption: "Breakout / Connecting visual observations to actions."

- slug: music-guess
  title: Music Guess Game
  category: Full-stack / Interactive application
  summary: A guessing game built around a local music collection. Identify a song from short audio snippets, with longer clips available as the round progresses.
  implementation: An Express API scans song metadata, handles rounds, and streams audio. A React frontend supports searching for guesses and revealing the answer.
  contribution: Built the game interface and backend, including music-library scanning, search, and round handling.
