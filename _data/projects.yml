- slug: radio
  title: Radio
  category: Full-stack / Music recommendation
  summary: A local-first desktop radio app that builds personalized queues for a 3,000-track music library, with recommendation retrieval under 30 ms.
  implementation: An Electron and React application connects to a FastAPI backend, with SQLite and ChromaDB supporting library data, listening history, and vector retrieval. An LLM and TTS DJ persona generate contextual spoken segments.
  contribution: Designed the product and interface, and built the recommendation pipeline and backend. Frontend implementation was AI-assisted.
  status: Refining onboarding and first-time setup.
